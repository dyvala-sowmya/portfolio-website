<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Dyvala Sowmya">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Contact Me</h1>
</header>

<nav aria-label="Main Navigation">
    <a href="index.html" aria-label="Home Page">Home</a>
    <a href="about.html" aria-label="About Page">About</a>
    <a href="projects.html" aria-label="Projects Page">Projects</a>
    <a href="contact.html" aria-label="Contact Page">Contact</a>
</nav>
<main>

<section>
    <h2>Get In Touch</h2>

    <form aria-label="Contact Form">

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name"
            aria-label="Enter your name"
            required>

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            aria-label="Enter your email"
            required>

        <label for="message">Message</label>
        <textarea
            id="message"
            name="message"
            rows="5"
            aria-label="Enter your message"
            required></textarea>

        <button type="submit">Send Message</button>

    </form>

</section>

</main>

<footer>
    <p>&copy; 2026 Dyvala Sowmya</p>
</footer>

</body>
</html>
